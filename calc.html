<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Saintifik</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1424;--panel:#131f36;--panel2:#1a2a47;--line:#263a5e;--text:#e6ecf5;--mute:#93a4c0;--accent:#5cc8ff;--warm:#ffb454;--err:#ff7b8a;
--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font-family:var(--mono);padding:1rem}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1rem;width:100%;max-width:420px;margin:0 auto}
.screen{background:#0a111f;border-radius:10px;padding:.8rem 1rem;text-align:right;font-family:var(--mono);min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#top{color:var(--mute);font-size:.9rem;min-height:1.4rem;word-break:break-all}
#main{font-size:1.9rem;font-weight:500;word-break:break-all;line-height:1.3}
#main.long{font-size:1.3rem}#main.err{color:var(--err);font-size:1.05rem}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font:.8rem var(--mono);color:var(--mute)}
#mode{font:600 .8rem var(--mono);background:var(--panel2);color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:.25rem .7rem;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem;margin-top:.8rem}
.keys button{font:500 1rem var(--mono);min-height:50px;border:0;border-radius:9px;background:var(--panel2);color:var(--text);cursor:pointer;transition:transform .06s,filter .15s}
.keys button:hover{filter:brightness(1.2)}.keys button:active{transform:scale(.95)}
.keys .fn{color:var(--accent);font-size:.92rem}.keys .op{background:#22385f}
.keys .num{background:#101a2e}.keys .act{background:#3a2a36;color:var(--err)}
.keys .eq{background:var(--warm);color:#1d1202;font-weight:600;grid-column:span 2}
.keys .z{grid-column:span 2}
@media(max-width:380px){.keys{gap:.3rem}.keys button{min-height:46px;font-size:.9rem}}</style></head><body>
<div class="calc" aria-label="Kalkulator saintifik">
<div class="bar"><span>Scientific</span><button id="mode" type="button" aria-label="Ganti satuan sudut">DEG</button></div>
<div class="screen" aria-live="polite"><div id="top"></div><div id="main">0</div></div>
<div class="keys" id="keys"></div></div>
<script>
(function(){
const KEYS=[
['sin','sin(','fn'],['cos','cos(','fn'],['tan','tan(','fn'],['π','π','fn'],['e','e','fn'],
['√','√(','fn'],['x²','^2','fn'],['xʸ','^','fn'],['log','log(','fn'],['ln','ln(','fn'],
['(','(','op'],[')',')','op'],['!','!','op'],['%','%','op'],['⌫','','act back'],
['7','7','num'],['8','8','num'],['9','9','num'],['÷','÷','op'],['AC','','act clear'],
['4','4','num'],['5','5','num'],['6','6','num'],['×','×','op'],['−','−','op'],
['1','1','num'],['2','2','num'],['3','3','num'],['+','+','op'],['Ans','','fn ans'],
['0','0','num z'],['.','.','num'],['=','','eq']
];
const BIN='+−×÷^%',CONT=['+','−','×','÷','^','%','!','^2',')'];
let expr='',ans=0,ansExpr='0',done=false,error='',deg=true;
const $=id=>document.getElementById(id),topEl=$('top'),mainEl=$('main'),modeEl=$('mode');

/* ---------- Tokenizer ---------- */
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){
    const r=s.slice(i),ch=s[i];
    if(/\s/.test(ch)){i++;continue}
    let m=r.match(/^(\d+\.?\d*|\.\d+)/);
    if(m){t.push({n:parseFloat(m[1])});i+=m[1].length;continue}
    m=r.match(/^(sin|cos|tan|log|ln)/);
    if(m){t.push({f:m[1]});i+=m[1].length;continue}
    if(ch==='√'){t.push({f:'√'});i++;continue}
    if(ch==='π'){t.push({n:Math.PI});i++;continue}
    if(ch==='e'){t.push({n:Math.E});i++;continue}
    if('+−-×÷^%!()'.includes(ch)){t.push({o:ch==='-'?'−':ch});i++;continue}
    throw Error('Karakter tidak valid');
  }
  return t;
}

/* ---------- Fungsi matematika ---------- */
const rad=x=>deg?x*Math.PI/180:x;
const clean=v=>Math.abs(v)<1e-14?0:v;
function fact(n){
  if(!Number.isInteger(n)||n<0)throw Error('Faktorial hanya untuk bilangan bulat ≥ 0');
  if(n>170)throw Error('Hasil terlalu besar');
  let r=1;for(let i=2;i<=n;i++)r*=i;return r;
}
function applyFn(f,a){
  switch(f){
    case'sin':return clean(Math.sin(rad(a)));
    case'cos':return clean(Math.cos(rad(a)));
    case'tan':if(Math.abs(Math.cos(rad(a)))<1e-12)throw Error('tan tidak terdefinisi untuk sudut ini');
      return clean(Math.tan(rad(a)));
    case'√':if(a<0)throw Error('Akar bilangan negatif tidak valid');return Math.sqrt(a);
    case'log':if(a<=0)throw Error('log hanya untuk bilangan > 0');return Math.log10(a);
    case'ln':if(a<=0)throw Error('ln hanya untuk bilangan > 0');return Math.log(a);
  }
}

/* ---------- Parser (recursive descent) ---------- */
function parse(tokens){
  let p=0;
  const pk=()=>tokens[p],nx=()=>tokens[p++];
  const isO=(...a)=>pk()&&pk().o&&a.includes(pk().o);
  const startsOperand=()=>pk()&&(pk().n!==undefined||pk().f||pk().o==='(');
  function expr(){let v=term();
    while(isO('+','−')){const o=nx().o,r=term();v=o==='+'?v+r:v-r}
    return v}
  function term(){let v=unary();
    for(;;){
      if(isO('×','÷','%')){
        const o=nx().o,r=unary();
        if(o==='×')v*=r;
        else{
          if(r===0)throw Error(o==='÷'?'Tidak bisa dibagi dengan nol':'Modulo nol tidak valid');
          v=o==='÷'?v/r:v%r;
        }
      }else if(startsOperand())v*=unary(); /* perkalian implisit: 2π, 3(4) */
      else break;
    }
    return v}
  function unary(){
    if(isO('−')){nx();return -unary()}
    if(isO('+')){nx();return unary()}
    return power()}
  function power(){const b=post();
    if(isO('^')){nx();return Math.pow(b,unary())}
    return b}
  function post(){let v=prim();
    while(isO('!')){nx();v=fact(v)}
    return v}
  function prim(){
    const t=nx();
    if(!t)throw Error('Ekspresi belum lengkap');
    if(t.n!==undefined)return t.n;
    if(t.o==='('){const v=expr();if(!isO(')'))throw Error('Kurung tidak seimbang');nx();return v}
    if(t.f)return applyFn(t.f,post());
    throw Error('Ekspresi tidak valid')}
  const result=expr();
  if(p<tokens.length)throw Error('Ekspresi tidak valid');
  return result;
}

/* ---------- Format hasil ---------- */
function fmt(r){
  if(!Number.isFinite(r))throw Error('Hasil tidak terdefinisi');
  let n=parseFloat(r.toPrecision(12));if(Object.is(n,-0))n=0;
  if(n!==0&&(Math.abs(n)>=1e15||Math.abs(n)<1e-9))return n.toExponential(6).replace(/\.?0+e/,'e');
  return String(n);
}
function asExpr(n){
  const s=String(n);
  if(!/e/.test(s))return s;
  const [m,x]=s.split('e');return '('+m+'×10^'+parseInt(x)+')';
}

/* ---------- Tampilan ---------- */
function render(){
  if(error){mainEl.textContent=error;mainEl.className='err';return}
  const txt=expr||'0';
  mainEl.textContent=txt;
  mainEl.className=txt.length>14?'long':'';
}
function clearAll(){expr='';done=false;error='';topEl.textContent='';render()}
function calculate(){
  if(error){clearAll();return}
  if(!expr||done)return;
  try{
    let s=expr;
    const open=(s.match(/\(/g)||[]).length,close=(s.match(/\)/g)||[]).length;
    if(close>open)throw Error('Kurung tidak seimbang');
    s+=')'.repeat(open-close);
    const v=parse(tokenize(s)),out=fmt(v);
    topEl.textContent=expr+' =';
    ans=parseFloat(out);ansExpr=asExpr(ans);
    expr=out;done=true;
    mainEl.textContent=out;mainEl.className=out.length>14?'long':'';
  }catch(e){error=e.message;topEl.textContent=expr;done=false;render()}
}
function press(v,type){
  if(error){clearAll()}
  if(type==='back'){
    if(done){clearAll();return}
    expr=expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|√\()$/,'')===expr?expr.slice(0,-1):expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|√\()$/,'');
    render();return}
  if(type==='clear'){clearAll();return}
  if(type==='eq'){calculate();return}
  if(type==='ans')v=ansExpr;
  if(done){
    if(CONT.includes(v)){done=false;expr=ansExpr}
    else{expr='';done=false;topEl.textContent=''}
  }
  if(v==='.'&&/\d*\.\d*$/.test(expr))return;
  if(v==='.'&&!/\d$/.test(expr))v='0.';
  if(BIN.includes(v)&&v.length===1){
    const last=expr.slice(-1);
    if(BIN.includes(last)){
      if(v==='−'&&'×÷^%'.includes(last)){}
      else expr=expr.slice(0,-1);
    }
  }
  expr+=v;render();
}
function setMode(){deg=!deg;modeEl.textContent=deg?'DEG':'RAD'}

/* ---------- Pasang tombol ---------- */
const keysEl=$('keys');
KEYS.forEach(([label,val,cls])=>{
  const b=document.createElement('button');
  b.type='button';b.textContent=label;b.className=cls.replace(/\b(back|clear|ans)\b/,'').trim()+(cls.includes('act')?'':'');
  const type=/back/.test(cls)?'back':/clear/.test(cls)?'clear':/ans/.test(cls)?'ans':label==='='?'eq':'';
  if(label==='='){b.className='eq'}
  b.setAttribute('aria-label',{'⌫':'Hapus karakter terakhir','AC':'Hapus semua','=':'Hitung'}[label]||label);
  b.addEventListener('click',()=>press(val,type));
  keysEl.appendChild(b);
});
modeEl.addEventListener('click',setMode);

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const inCalc=document.activeElement===document.body||document.activeElement.closest('.calc');
  if(!inCalc)return;
  const k=e.key,map={'*':'×','/':'÷','-':'−'};
  if(/^[0-9.+^%!()]$/.test(k)||map[k]){e.preventDefault();press(map[k]||k,'')}
  else if(k==='Enter'||k==='='){e.preventDefault();press('','eq')}
  else if(k==='Backspace'){e.preventDefault();press('','back')}
  else if(k==='Escape'){press('','clear')}
});

render();
})();
</script>
</body></html>
